# Profile graphics in the site's neon palette: a 3D contribution calendar and the contribution snake.
# Generated here and committed to the repo, so the README never depends on a rate-limited public API.
name: Profile graphics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml", ".github/profile-3d.json"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d.json
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile-3d-contrib/snake.svg?color_snake=#22e3ff&color_dots=#141933,#1b3f73,#1f8fbf,#9d5cff,#ff3cd0
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || { git commit -m "Update profile graphics" && git push; }
